name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v3

      # El wrapper esta versionado en el repo (gradle/wrapper/), asi que el CI
      # usa siempre la misma version de Gradle que la maquina de desarrollo.
      - name: Hacer ejecutable el wrapper
        run: chmod +x ./gradlew

      - name: Tests unitarios
        run: ./gradlew testDebugUnitTest

      - name: Lint
        run: ./gradlew lintDebug

      - name: Build APK debug
        run: ./gradlew assembleDebug -PversionCode=${{ github.run_number }}

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: photoframe-debug
          path: app/build/outputs/apk/debug/*.apk
